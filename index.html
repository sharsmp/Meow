<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depende kung 3 to</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F1E4;
    --cream-card:#FFFBF3;
    --matcha:#7C9468;
    --matcha-deep:#3B4A30;
    --matcha-text:#33402A;
    --blush:#D9A08C;
    --blossom:#F2AFC6;
    --blossom-deep:#D6698A;
    --gold:#B98B3E;
    --shadow: rgba(59,74,48,0.15);
    --line: rgba(59,74,48,0.18);
  }
  * { box-sizing:border-box; }
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(circle at 20% 10%, #fdf6f4 0%, var(--cream) 50%, #f7e3e8 100%);
    font-family:'Work Sans', sans-serif;
    color:var(--matcha-text);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  /* ---------- AMBIENT PETALS ---------- */
  .petals-layer{
    position:fixed; inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .petal{
    position:absolute;
    top:-5%;
    width:14px; height:14px;
    opacity:0;
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .petal svg{ width:100%; height:100%; display:block; }
  @keyframes drift{
    0%{ transform:translateY(-5vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:.55; }
    88%{ opacity:.45; }
    100%{ transform:translateY(105vh) translateX(26px) rotate(220deg); opacity:0; }
  }

  /* ---------- COVER / ENVELOPE ---------- */
  #cover{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    text-align:center;
    position:relative;
    z-index:1;
    transition:opacity .7s ease, transform .7s ease;
  }
  #cover.hidden-cover{ opacity:0; transform:scale(.96); pointer-events:none; position:absolute; }

  .cover-label{
    font-family:'Caveat', cursive;
    font-size:22px;
    color:var(--blossom-deep);
    letter-spacing:.3px;
  }

  .envelope{
    position:relative;
    width:min(300px, 78vw);
    height:200px;
    cursor:pointer;
    perspective:800px;
  }
  .envelope-body{
    position:absolute; inset:0;
    background: linear-gradient(180deg, var(--cream-card), #f3ecdb);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow: 0 18px 34px var(--shadow);
  }
  .envelope-flap{
    position:absolute;
    top:0; left:0; width:100%; height:60%;
    background: linear-gradient(160deg, #ece2c9, #dfd3b3);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .8s cubic-bezier(.4,0,.2,1);
    border-bottom:1px solid var(--line);
    backface-visibility:hidden;
  }
  .envelope.open .envelope-flap{ transform: rotateX(180deg); }

  .seal{
    position:absolute;
    top:50%; left:50%;
    width:56px; height:56px;
    background: radial-gradient(circle at 35% 30%, #f6c9d6, var(--blossom-deep));
    border-radius:50%;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 14px rgba(214,105,138,.4);
    z-index:2;
    transition: transform .3s ease;
  }
  .envelope:hover .seal{ transform:translate(-50%,-50%) scale(1.05); }
  .seal svg{ width:24px; height:24px; }

  .open-hint{
    font-size:13px;
    color:var(--matcha-deep);
    opacity:.7;
    letter-spacing:.4px;
  }

  /* ---------- LETTER VIEW ---------- */
  #letter{
    width:min(560px, 92vw);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    opacity:0;
    position:relative;
    z-index:1;
    transform:translateY(18px);
    transition:opacity .8s ease, transform .8s ease;
  }
  #letter.show{ opacity:1; transform:translateY(0); }

  .string-bar{
    position:relative;
    width:100%;
    height:78px;
    margin-bottom:-1px;
  }
  .string-line{
    position:absolute; left:4%; right:4%; top:36px;
    height:2px;
    background: linear-gradient(90deg, transparent, var(--gold) 8%, var(--gold) 92%, transparent);
    border-radius:2px;
    overflow:hidden;
  }
  .string-line::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.55) 0 1px, transparent 1px 4px);
    opacity:.5;
  }
  .charm{
    position:absolute; top:6px;
    display:flex; flex-direction:column; align-items:center;
    transform-origin: top center;
    animation: sway 4.5s ease-in-out infinite;
  }
  .charm .clip{ width:10px; height:14px; background:var(--matcha-deep); border-radius:2px 2px 4px 4px; margin-bottom:1px;}
  .charm .thread{ width:1.5px; height:14px; background:var(--line); }
  .charm .icon{ width:34px; height:34px; margin-top:-1px; display:block; }

  .charm.c1{ left:20%; animation-delay:0s;}
  .charm.c2{ left:50%; transform:translateX(-50%); animation-delay:.6s;}
  .charm.c3{ left:80%; animation-delay:1.2s;}

  @keyframes sway{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }
  .charm.c2{ animation-name: sway-center; }
  @keyframes sway-center{
    0%,100%{ transform:translateX(-50%) rotate(-4deg); }
    50%{ transform:translateX(-50%) rotate(4deg); }
  }

  .card{
    width:100%;
    background:var(--cream-card);
    border:1px solid var(--line);
    border-radius:4px 4px 14px 14px;
    box-shadow:0 24px 50px var(--shadow);
    padding:46px 40px 40px;
    position:relative;
  }
  .kicker{
    font-family:'Caveat', cursive;
    font-size:20px;
    color:var(--blossom-deep);
    text-align:center;
    display:block;
    margin-bottom:18px;
  }
  .greeting{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:26px;
    color:var(--matcha-deep);
    margin:0 0 22px;
    min-height:34px;
  }
  .greeting .cursor{
    display:inline-block;
    width:2px; height:22px;
    background:var(--matcha-deep);
    margin-left:2px;
    animation: blink 1s step-end infinite;
    vertical-align:-3px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .letter-body p{
    font-family:'Cormorant Garamond', serif;
    font-size:21px;
    line-height:1.65;
    color:var(--matcha-text);
    margin:0 0 20px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .letter-body p.reveal{ opacity:1; transform:translateY(0); }

  .signature{
    font-family:'Caveat', cursive;
    font-size:30px;
    color:var(--matcha-deep);
    text-align:right;
    margin-top:8px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .signature.reveal{ opacity:1; transform:translateY(0); }
  .sig-flourish{ display:block; width:64px; height:12px; margin:6px 0 0 auto; }

  .again-wrap{ margin-top:26px; text-align:center; }
  .again-btn{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    letter-spacing:.4px;
    color:var(--matcha-deep);
    background:transparent;
    border:1px solid var(--line);
    padding:10px 20px;
    border-radius:20px;
    cursor:pointer;
    opacity:0;
    transition:opacity .7s ease, background .2s ease, color .2s ease;
  }
  .again-btn.reveal{ opacity:.85; }
  .again-btn:hover{ background:var(--blossom-deep); color:var(--cream-card); }
  .again-btn:focus-visible, .envelope:focus-visible .seal{ outline:2px solid var(--matcha-deep); outline-offset:3px; }

  @media (max-width: 480px){
    .card{ padding:34px 22px 30px; }
    .greeting{ font-size:22px; }
    .letter-body p{ font-size:19px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:opacity .3s ease !important; }
    .petals-layer{ display:none; }
  }
</style>
</head>
<body>

  <div class="petals-layer" aria-hidden="true">
    <div class="petal" style="left:6%; animation-duration:12s; animation-delay:0s;"><svg viewBox="0 0 16 16"><path d="M8 1c3 2 5 5 5 8a5 5 0 0 1-10 0c0-3 2-6 5-8z" fill="#F2AFC6"/></svg></div>
    <div class="petal" style="left:18%; animation-duration:10s; animation-delay:1.6s;"><svg viewBox="0 0 16 16"><path d="M8 1c3 2 5 5 5 8a5 5 0 0 1-10 0c0-3 2-6 5-8z" fill="#E58EA6"/></svg></div>
    <div class="petal" style="left:34%; animation-duration:13s; animation-delay:3.2s;"><svg viewBox="0 0 16 16"><path d="M8 1c3 2 5 5 5 8a5 5 0 0 1-10 0c0-3 2-6 5-8z" fill="#F2AFC6"/></svg></div>
    <div class="petal" style="left:52%; animation-duration:11s; animation-delay:4.8s;"><svg viewBox="0 0 16 16"><path d="M8 1c3 2 5 5 5 8a5 5 0 0 1-10 0c0-3 2-6 5-8z" fill="#D6698A"/></svg></div>
    <div class="petal" style="left:68%; animation-duration:14s; animation-delay:6.4s;"><svg viewBox="0 0 16 16"><path d="M8 1c3 2 5 5 5 8a5 5 0 0 1-10 0c0-3 2-6 5-8z" fill="#E58EA6"/></svg></div>
    <div class="petal" style="left:84%; animation-duration:10.5s; animation-delay:8s;"><svg viewBox="0 0 16 16"><path d="M8 1c3 2 5 5 5 8a5 5 0 0 1-10 0c0-3 2-6 5-8z" fill="#F2AFC6"/></svg></div>
  </div>

  <div id="cover">
    <span class="cover-label">a little something for you</span>
    <div class="envelope" id="envelope" tabindex="0" role="button" aria-label="Open the letter">
      <div class="envelope-body"></div>
      <div class="envelope-flap"></div>
      <div class="seal">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.5-9.5-9C.5 7 2 3 6 3c2.4 0 4 1.6 6 4 2-2.4 3.6-4 6-4 4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z" fill="#FFFBF3"/></svg>
      </div>
    </div>
    <span class="open-hint">tap the seal to open</span>
  </div>

  <div id="letter">
    <div class="string-bar">
      <div class="string-line"></div>
      <div class="charm c1">
        <div class="clip"></div><div class="thread"></div>
        <svg class="icon" viewBox="0 0 34 34" aria-hidden="true">
          <rect x="6" y="14" width="22" height="6" rx="3" fill="#F2AFC6" stroke="#3B4A30" stroke-width="1"/>
          <line x1="9" y1="17" x2="25" y2="17" stroke="#3B4A30" stroke-width="1" stroke-dasharray="2 2"/>
        </svg>
      </div>
      <div class="charm c2">
        <div class="clip"></div><div class="thread"></div>
        <svg class="icon" viewBox="0 0 34 34" aria-hidden="true">
          <path d="M9 14h16l-2 12a3 3 0 0 1-3 2H14a3 3 0 0 1-3-2L9 14z" fill="#7C9468" stroke="#3B4A30" stroke-width="1"/>
          <path d="M15 10c0-2 2-2 2-4M19 10c0-2 2-2 2-4" stroke="#B98B3E" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="charm c3">
        <div class="clip"></div><div class="thread"></div>
        <svg class="icon" viewBox="0 0 34 34" aria-hidden="true">
          <circle cx="17" cy="17" r="12" fill="none" stroke="#B98B3E" stroke-width="1.2"/>
          <line x1="17" y1="10" x2="17" y2="24" stroke="#B98B3E" stroke-width="1.6"/>
          <line x1="12" y1="15" x2="22" y2="15" stroke="#B98B3E" stroke-width="1.6"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <span class="kicker">read whenever you need it</span>
      <p class="greeting" id="greeting"><span id="greetingText"></span><span class="cursor"></span></p>
      <div class="letter-body" id="letterBody"></div>
      <p class="signature" id="signature">
        <span id="signatureText"></span>
        <svg class="sig-flourish" viewBox="0 0 70 14" aria-hidden="true"><path d="M2 8c8-10 14 6 22-2s14 6 22-2 14 6 20-2" fill="none" stroke="#D6698A" stroke-width="1.6" stroke-linecap="round"/></svg>
      </p>
      <div class="again-wrap"><button class="again-btn" id="againBtn">read it again</button></div>
    </div>
  </div>

<script>
  const herName = "Chenchen";
  const yourName = "Meow";
  // -----------------------------------------------------------

  const paragraphs = [
    "I don't think I say this enough, or maybe I don't say it right, but I love you. Not the small, easy kind of love \u2014 the kind that's so much I can't even measure it myself. Only God really knows how much.",
    "I also owe you an apology. There have been times I left you overthinking, times I went quiet when you needed me to just talk to you, and that's on me. You deserve someone who shows up and explains himself, not someone who makes you guess. I'm sorry, and I mean that.",
    "If you'll let me, I want to keep texting you every single day \u2014 not out of habit, but because I want to. I want to tell you the small, boring parts of my day and the good parts too, and I want to hear about yours. I miss you when that's missing.",
    "I notice things about you, by the way. The hairclip you always have somewhere close. How a good matcha can turn your whole day around. The way you sound on guitar when you think no one's listening. How close you are with God, and how it shows in everything you do. I notice, and I love all of it.",
    "I'm not perfect at this. But I'm here, and I'm not going anywhere.",
    "I love you. So, so much."
  ];

  const envelope = document.getElementById('envelope');
  const cover = document.getElementById('cover');
  const letter = document.getElementById('letter');
  const greetingText = document.getElementById('greetingText');
  const letterBody = document.getElementById('letterBody');
  const signature = document.getElementById('signature');
  const againBtn = document.getElementById('againBtn');

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  paragraphs.forEach(text => {
    const p = document.createElement('p');
    p.textContent = text;
    letterBody.appendChild(p);
  });
  document.getElementById('signatureText').textContent = `\u2014 ${yourName}`;

  function typeGreeting(cb){
    const full = `To ${herName},`;
    greetingText.textContent = '';
    if(reduced){ greetingText.textContent = full; cb(); return; }
    let i = 0;
    const t = setInterval(()=>{
      greetingText.textContent = full.slice(0, i+1);
      i++;
      if(i >= full.length){ clearInterval(t); cb(); }
    }, 55);
  }

  function revealLetter(){
    letter.classList.add('show');
    typeGreeting(()=>{
      const ps = letterBody.querySelectorAll('p');
      ps.forEach((p, idx)=>{
        setTimeout(()=> p.classList.add('reveal'), reduced ? 0 : 500 + idx*550);
      });
      const tail = reduced ? 200 : 500 + ps.length*550 + 300;
      setTimeout(()=> signature.classList.add('reveal'), tail);
      setTimeout(()=> againBtn.classList.add('reveal'), tail + 300);
    });
  }

  function openEnvelope(){
    envelope.classList.add('open');
    setTimeout(()=>{
      cover.classList.add('hidden-cover');
      revealLetter();
    }, reduced ? 100 : 650);
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelope(); }
  });

  againBtn.addEventListener('click', ()=>{
    letter.classList.remove('show');
    letterBody.querySelectorAll('p').forEach(p=>p.classList.remove('reveal'));
    signature.classList.remove('reveal');
    againBtn.classList.remove('reveal');
    greetingText.textContent = '';
    envelope.classList.remove('open');
    cover.classList.remove('hidden-cover');
  });
</script>
</body>
</html>
